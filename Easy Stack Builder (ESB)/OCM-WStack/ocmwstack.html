<script type="text/html" data-template-name="OCM-W-Stack">
<style>
  .esb-ocm-form {
    --esb-accent:#236879;
    --esb-line:var(--red-ui-form-input-border-color,#d8e2e5);
    max-width:760px;
  }
  .esb-ocm-hero {
    padding:20px 22px;
    background:linear-gradient(120deg,#174d61,#337c80);
    color:white;
    border-radius:12px;
    margin-bottom:18px;
  }
  .esb-ocm-hero h3 {
    margin:0 0 6px;
    font-size:21px;
    color:white;
  }
  .esb-ocm-hero p {
    margin:0;
    opacity:.9;
  }
  .esb-ocm-hero small {
    display:block;
    margin-top:12px;
    opacity:.8;
  }
  .esb-ocm-form .esb-card {
    border:1px solid var(--esb-line);
    border-radius:10px;
    padding:18px;
    margin:14px 0;
  }
  .esb-ocm-form .esb-card h4 {
    margin:0 0 14px;
    font-size:15px;
  }
  .esb-ocm-form .form-row label {
    width:165px;
    vertical-align:top;
    line-height:30px;
  }
  .esb-ocm-form .form-row input:not([type=checkbox]),.esb-ocm-form .form-row select,.esb-ocm-form textarea {
    width:calc(100% - 180px);
    box-sizing:border-box;
  }
  .esb-ocm-form .form-row input[type=checkbox] {
    width:auto;
    margin-top:8px;
  }
  .esb-ocm-form .esb-note {
    color:var(--red-ui-secondary-text-color,#596b74);
    font-size:12px;
    line-height:1.6;
    margin:8px 0;
  }
  .esb-ocm-form .esb-upload {
    padding:10px 0;
    border-bottom:1px solid var(--esb-line);
    margin-bottom:8px;
  }
  .esb-ocm-form .esb-file-status {
    display:block;
    margin:3px 0 0 170px;
    color:var(--esb-accent);
    font-size:12px;
  }
  .esb-ocm-form .esb-preview {
    padding:12px;
    border-left:3px solid var(--esb-accent);
    background:var(--red-ui-secondary-background,#f0f5f6);
    overflow-wrap:anywhere;
    margin:12px 0;
  }
  .esb-ocm-form summary {
    cursor:pointer;
    font-weight:600;
    padding:10px 0;
  }
  .esb-ocm-form details>div {
    padding-top:10px;
  }
</style>
<div class="esb-ocm-form">
  <div class="esb-ocm-hero">
    <h3>
      OCM W-Stack
    </h3>
    <p>
      Your OCM W-Stack UI, native services and infrastructure in one deployment.
    </p>
    <small>
      ESB 12.4.0
    </small>
  </div>
  <ul id="esb-ocm-tabs">
  </ul>
  <div id="esb-ocm-panels">
    <div id="esb-ocm-connect">
      <div class="esb-card">
        <h4>
          Connect your cluster
        </h4>
        <div class="form-row">
          <label for="node-input-name">
            Node label
          </label>
          <input id="node-input-name" placeholder="OCM W-Stack">
        </div>
        <div class="form-row esb-upload">
          <label for="esb-kube-file">
            Kubeconfig
          </label>
          <input id="esb-kube-file" type="file" accept=".yaml,.yml,.conf,.txt">
          <span id="esb-kube-status" class="esb-file-status">
          </span>
        </div>
        <input type="password" style="display:none" id="node-input-kubeconfig">
        <p class="esb-note">
          Upload a self-contained cluster-admin kubeconfig. The cluster needs working LoadBalancer and persistent-volume provisioners. Hetzner and IONOS are detected automatically.
        </p>
      </div>
      <div class="esb-card">
        <h4>
          Deployment options
        </h4>
        <div class="form-row">
          <label for="node-input-externalDns">
            Manage DNS records
          </label>
          <input id="node-input-externalDns" type="checkbox">
        </div>
        <div id="esb-dns-fields">
          <div class="form-row">
            <label for="node-input-dnsProvider">
              DNS provider
            </label>
            <select id="node-input-dnsProvider">
              <option value="auto">
                Detect from cluster
              </option>
              <option value="hetzner">
                Hetzner
              </option>
              <option value="ionos">
                IONOS
              </option>
              <option value="custom">
                Other ExternalDNS provider
              </option>
            </select>
          </div>
          <div id="esb-dns-token" class="form-row">
            <label for="node-input-dnsToken">
              DNS API token
            </label>
            <input type="password" id="node-input-dnsToken" autocomplete="new-password">
          </div>
          <div id="esb-dns-custom">
            <div class="form-row">
              <label for="node-input-dnsValues">
                Provider values
              </label>
              <textarea id="node-input-dnsValues">
              </textarea>
            </div>
            <div class="form-row">
              <label for="node-input-dnsSecretData">
                Provider credentials
              </label>
              <input type="password" id="node-input-dnsSecretData" autocomplete="new-password">
            </div>
            <p class="esb-note">
              ExternalDNS provider values and Secret key/value data, as JSON. See the provider examples in README.
            </p>
          </div>
        </div>
        <p id="esb-manual-dns" class="esb-note">
          You manage DNS. Progress output reports the gateway address; point your selected hostnames to it. Deployment waits for HTTPS to respond.
        </p>
        <div class="form-row">
          <label for="node-input-publicDashboards">
            Public dashboards
          </label>
          <input id="node-input-publicDashboards" type="checkbox">
        </div>
        <p class="esb-note">
          Enable authenticated Argo CD and Grafana at argocd and grafana on your base domain. The OCM W-Stack UI and native tenant services are always public.
        </p>
      </div>
      <details>
        <summary>
          Advanced · provider and storage
        </summary>
        <div>
          <div class="form-row">
            <label for="node-input-provider">
              Cluster provider
            </label>
            <select id="node-input-provider">
              <option value="auto">
                Detect automatically
              </option>
              <option value="hetzner">
                Hetzner
              </option>
              <option value="ionos">
                IONOS Cloud
              </option>
              <option value="generic">
                Generic Kubernetes
              </option>
              <option value="aws">
                AWS
              </option>
              <option value="azure">
                Azure
              </option>
              <option value="gcp">
                Google Cloud
              </option>
              <option value="openstack">
                OpenStack
              </option>
              <option value="digitalocean">
                DigitalOcean
              </option>
              <option value="oci">
                Oracle Cloud
              </option>
              <option value="scaleway">
                Scaleway
              </option>
              <option value="alibaba">
                Alibaba Cloud
              </option>
            </select>
          </div>
          <div id="esb-hetzner">
            <div class="form-row">
              <label for="node-input-lbLocation">
                Hetzner location
              </label>
              <input id="node-input-lbLocation" placeholder="Detected from node topology">
            </div>
            <p class="esb-note">
              Only set a location if your cluster spans regions. Annotations are generated from the detected topology.
            </p>
          </div>
          <div class="form-row">
            <label for="node-input-storageClass">
              StorageClass
            </label>
            <input id="node-input-storageClass" placeholder="Cluster default">
          </div>
          <div class="form-row">
            <label for="node-input-runtimeImage">
              OCM UI image
            </label>
            <input type="text" id="node-input-runtimeImage" placeholder="registry.example/ocm-ui@sha256:…">
          </div>
          <div class="form-row">
            <label for="node-input-useExternalMongo">
              External MongoDB
            </label>
            <input id="node-input-useExternalMongo" type="checkbox">
          </div>
          <div id="esb-mongo-uri" class="form-row">
            <label for="node-input-mongoUri">
              MongoDB URI
            </label>
            <input type="password" id="node-input-mongoUri" autocomplete="new-password">
          </div>
          <div class="form-row">
            <label for="node-input-orceStorageSize">
              ORCE storage
            </label>
            <input id="node-input-orceStorageSize">
          </div>
          <div class="form-row">
            <label for="node-input-mongoStorageSize">
              MongoDB storage
            </label>
            <input id="node-input-mongoStorageSize">
          </div>
          <div class="form-row">
            <label for="node-input-timeoutSeconds">
              Stage timeout
            </label>
            <input type="number" id="node-input-timeoutSeconds" min="60" max="7200">
          </div>
        </div>
      </details>
    </div>
    <div id="esb-ocm-domain" style="display:none">
      <div class="esb-card">
        <h4>
          Domain
          &amp;
          certificate
        </h4>
        <div class="form-row">
          <label for="node-input-domainAddress">
            Base domain
          </label>
          <input id="node-input-domainAddress" placeholder="example.com">
        </div>
        <div class="form-row">
          <label for="node-input-tenantId">
            Tenant name
          </label>
          <input id="node-input-tenantId" placeholder="demo-tenant">
        </div>
        <div id="esb-tenant-preview" class="esb-preview">
        </div>
        <div class="form-row esb-upload">
          <label for="esb-cert-file">
            Fullchain certificate
          </label>
          <input id="esb-cert-file" type="file" accept=".pem,.crt,.cer,.txt">
          <span id="esb-cert-status" class="esb-file-status">
          </span>
        </div>
        <div class="form-row esb-upload">
          <label for="esb-key-file">
            Private key
          </label>
          <input id="esb-key-file" type="file" accept=".pem,.key,.txt">
          <span id="esb-key-status" class="esb-file-status">
          </span>
        </div>
        <input type="password" style="display:none" id="node-input-tlsCertificate">
        <input type="password" style="display:none" id="node-input-tlsPrivateKey">
        <p class="esb-note">
          Use a public trusted PEM fullchain and its matching unencrypted PEM private key. A wildcard certificate such as *.example.com covers the tenant and optional dashboard hostnames. Upload renewed files here and run Deploy to replace them.
        </p>
      </div>
    </div>
    <div id="esb-ocm-access" style="display:none">
      <div class="esb-card">
        <h4>
          OCM UI administrator
        </h4>
        <div class="form-row">
          <label for="node-input-uiAdminUsername">
            Username
          </label>
          <input id="node-input-uiAdminUsername" autocomplete="off">
        </div>
        <div class="form-row">
          <label for="node-input-uiAdminPassword">
            Initial password
          </label>
          <input type="password" id="node-input-uiAdminPassword" autocomplete="new-password">
        </div>
        <p class="esb-note">
          At least 12 characters. The OCM W-Stack UI asks for a new password at first login. Accounts and roles survive subsequent deployments.
        </p>
      </div>
      <div class="esb-card">
        <h4>
          Editor administrator
        </h4>
        <div class="form-row">
          <label for="node-input-editorUsername">
            Username
          </label>
          <input id="node-input-editorUsername" autocomplete="off">
        </div>
        <div class="form-row">
          <label for="node-input-editorPassword">
            Initial password
          </label>
          <input type="password" id="node-input-editorPassword" autocomplete="new-password">
        </div>
        <p class="esb-note">
          Use a separate password of at least 12 characters. Optional dashboards initially use this password with username admin. Later password changes are retained.
        </p>
      </div>
      <div class="esb-preview">
        Supply the built OCM UI runtime image for this deployment.
      </div>
    </div>
  </div>
  <p class="esb-note">
    Connect an Inject node to start Deploy. Output 1 returns the result; output 2 shows progress, detected settings and DNS targets. An existing matching installation resumes safely.
  </p>
</div>
</script>
<script type="text/javascript">
(function () {
  function jsonObject(value) {
    if (!value) return true;
    try {
      const parsed = JSON.parse(value);
      return parsed && typeof parsed === 'object' && !Array.isArray(parsed);
    } catch {
      return false;
    }
  }

  RED.nodes.registerType('OCM-W-Stack', {
    category: 'Easy Stack Builder',
    color: '#c7e2e4',
    icon: 'font-awesome/fa-cubes',
    inputs: 1,
    outputs: 2,
    outputLabels: ['Result', 'Progress'],
    label: function () { return this.name || 'OCM W-Stack'; },
    defaults: {
      name: { value: '' },
      procedureVersion: { value: 12 },
      instanceName: { value: 'ocm-wstack' },
      domainAddress: { value: '', required: true },
      emailAddress: { value: '' },
      tenantId: { value: 'demo-tenant', required: true },
      tenantRelease: { value: 'demotenant' },
      tenantSubdomain: { value: '' },
      provider: { value: 'auto' },
      storageClass: { value: '' },
      lbLocation: { value: '' },
      lbNetworkZone: { value: '' },
      lbType: { value: '' },
      lbPrivate: { value: false },
      lbAnnotations: { value: '{}' },
      externalTrafficPolicy: { value: 'Cluster' },
      gatewayRouting: { value: 'internal' },
      externalDns: { value: false },
      dnsProvider: { value: 'auto' },
      dnsValues: { value: '{}', validate: jsonObject },
      publicDashboards: { value: false },
      runtimeEnabled: { value: true },
      runtimeImage: { value: '' },
      runtimeServices: { value: '{}' },
      orceStorageSize: { value: '3Gi' },
      mongoStorageSize: { value: '5Gi' },
      useExternalMongo: { value: false },
      editorUsername: { value: 'admin' },
      uiAdminUsername: { value: 'admin' },
      uiAdminEmail: { value: '' },
      timeoutSeconds: {
        value: 1800,
        validate: function (value) {
          return Number.isInteger(Number(value)) && value >= 60 && value <= 7200;
        }
      }
    },
    credentials: {
      kubeconfig: { type: 'password' },
      tlsCertificate: { type: 'password' },
      tlsPrivateKey: { type: 'password' },
      dnsToken: { type: 'password' },
      dnsSecretData: { type: 'password' },
      editorPassword: { type: 'password' },
      uiAdminPassword: { type: 'password' },
      mongoUri: { type: 'password' }
    },
    oneditprepare: function () {
      const node = this;
      const tabs = RED.tabs.create({
        id: 'esb-ocm-tabs',
        onchange: function (tab) {
          $('#esb-ocm-panels').children().hide();
          $('#' + tab.id).show();
        }
      });
      [
        ['esb-ocm-connect', 'Cluster'],
        ['esb-ocm-domain', 'Domain & certificate'],
        ['esb-ocm-access', 'Access']
      ].forEach(function (tab) { tabs.addTab({ id: tab[0], label: tab[1] }); });
      tabs.activateTab('esb-ocm-connect');

      function upload(fileId, credential, statusId, maximumBytes) {
        const input = $('#node-input-' + credential);
        const status = $('#' + statusId);
        status.text(node.credentials && node.credentials['has_' + credential]
          ? 'Saved securely' : 'Choose a file');
        $('#' + fileId).on('change', function () {
          const file = this.files[0];
          if (!file) return;
          if (file.size > maximumBytes) {
            RED.notify('File is too large.', 'error');
            return;
          }
          const reader = new FileReader();
          reader.onload = function () {
            input.val('base64:' + reader.result.split(',')[1]).trigger('change');
            status.text(file.name + ' · ready');
          };
          reader.onerror = function () { RED.notify('Could not read ' + file.name, 'error'); };
          reader.readAsDataURL(file);
        });
      }
      upload('esb-kube-file', 'kubeconfig', 'esb-kube-status', 2097152);
      upload('esb-cert-file', 'tlsCertificate', 'esb-cert-status', 131072);
      upload('esb-key-file', 'tlsPrivateKey', 'esb-key-status', 131072);

      function options() {
        const automaticDns = $('#node-input-externalDns').prop('checked');
        const customDns = $('#node-input-dnsProvider').val() === 'custom';
        $('#esb-dns-fields').toggle(automaticDns);
        $('#esb-manual-dns').toggle(!automaticDns);
        $('#esb-dns-custom').toggle(customDns);
        $('#esb-dns-token').toggle(!customDns);
        $('#esb-mongo-uri').toggle($('#node-input-useExternalMongo').prop('checked'));
        $('#esb-hetzner').toggle(['auto', 'hetzner'].includes($('#node-input-provider').val()));
      }
      function preview() {
        const domain = $('#node-input-domainAddress').val().replace(/^\*\./, '') || 'example.com';
        const tenant = (node.tenantSubdomain || $('#node-input-tenantId').val() || 'demo-tenant')
          .toLowerCase().replace(/_/g, '-');
        $('#esb-tenant-preview').text('OCM W-Stack UI: https://' + tenant + '.' + domain + '/orce/');
      }
      $('#node-input-externalDns,#node-input-dnsProvider,#node-input-provider,#node-input-useExternalMongo')
        .on('change', options);
      $('#node-input-domainAddress,#node-input-tenantId').on('input', preview);
      options();
      preview();
    },
    oneditsave: function () {
      this.procedureVersion = 12;
      this.runtimeEnabled = true;
      this.gatewayRouting = 'internal';
      this.externalTrafficPolicy = 'Cluster';
    }
  });
})();
</script>
<script type="text/html" data-help-name="OCM-W-Stack">
  <p>Deploys the pinned XFSC revision, tenant, uploaded TLS and OCM W-Stack UI.
    Requires a cluster-admin kubeconfig and the tools listed by
    <code>bash deploy.sh check</code> in the deployment container.</p>
  <p>Set <code>msg.action</code> to <code>deploy</code> (default),
    <code>preflight</code>, <code>inspect</code>, <code>validate</code>,
    <code>diagnose-api</code>, <code>diagnose-auth</code> or
    <code>diagnose-storage</code>. Deploy also resumes the matching installation.</p>
  <p>Use <code>repair-network</code> for gateway configuration,
    <code>repair-ocm</code> for native services or <code>install-ui</code>
    for the deployed ORCE runtime and UI.</p>
  <p>Output 1 carries the JSON result with topic <code>ocm-wstack/result</code>.
    Output 2 carries progress with topic <code>ocm-wstack/progress</code>.</p>
  <p>With DNS automation off, set the reported A/AAAA or CNAME targets for the
    displayed hostnames. Renew uploaded TLS by replacing both certificate
    and key uploads, then running Deploy.</p>
  <p><code>test-credentials</code> requires
    <code>msg.confirm = "CREATE TEST CREDENTIAL"</code>. It exercises native
    issuance, retrieval and Storage read-back and retains its test data.</p>
  <p>Removing this node cancels local work and retains cluster data.
    <code>teardown</code> requires
    <code>msg.confirm = "REMOVE TENANT demotenant"</code> with the configured
    tenant release name. It removes the tenant Helm release.</p>
</script>
