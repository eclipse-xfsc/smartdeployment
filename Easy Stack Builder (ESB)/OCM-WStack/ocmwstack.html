<script type="text/html" data-template-name="OCM-W-Stack">
  <style>
    .esb-ocm-form .form-row label { width: 170px; vertical-align: top; }
    .esb-ocm-form .form-row input:not([type=checkbox]), .esb-ocm-form select, .esb-ocm-form textarea { width: calc(100% - 190px); }
    .esb-ocm-form textarea { min-height: 85px; font-family: monospace; }
    .esb-ocm-form .esb-note { margin: 8px 0 16px; color: var(--red-ui-secondary-text-color); }
    .esb-ocm-form h4 { margin-top: 20px; }
  </style>
  <div class="esb-ocm-form">
    <p>OCM W-Stack · official XFSC deployment procedure</p>
    <p class="esb-note">A fresh Kubernetes cluster is required. Deploy runs the upstream bootstrap and creates the tenant. Removing this node retains the deployment.</p>
    <input type="hidden" id="node-input-procedureVersion">
    <div class="form-row"><label for="node-input-name">Label</label><input type="text" id="node-input-name"></div>
    <div class="form-row"><label for="node-input-instanceName">Instance name</label><input type="text" id="node-input-instanceName"></div>
    <div class="form-row"><label for="node-input-domainAddress">Base domain</label><input type="text" id="node-input-domainAddress" placeholder="example.com"></div>
    <div class="form-row"><label for="node-input-emailAddress">Certificate email</label><input type="email" id="node-input-emailAddress"></div>
    <div class="form-row"><label for="node-input-kubeconfig">Kubeconfig credential</label><input type="password" id="node-input-kubeconfig" autocomplete="new-password" placeholder="Upload the cluster-admin kubeconfig below"></div>
    <div class="form-row"><label for="esb-ocm-kube-file">Upload kubeconfig</label><input type="file" id="esb-ocm-kube-file" accept=".yaml,.yml,.conf,.txt"></div>
    <p class="esb-note">Use a self-contained kubeconfig. Exec-based cloud authentication also requires its provider CLI and credentials in ORCE.</p>
    <h4>Cluster and networking</h4>
    <div class="form-row"><label for="node-input-provider">Cluster provider</label><select id="node-input-provider"><option value="auto">Detect automatically</option value="generic">Generic Kubernetes / bare metal</option value="hetzner">Hetzner</option><option value="aws">AWS</option><option value="azure">Azure</option><option value="gcp">Google Cloud</option><option value="openstack">OpenStack</option><option value="digitalocean">DigitalOcean</option><option value="oci">Oracle Cloud</option><option value="scaleway">Scaleway</option><option value="alibaba">Alibaba Cloud</option></select></div>
    <div class="form-row"><label for="node-input-storageClass">StorageClass</label><input type="text" id="node-input-storageClass" placeholder="Detect the cluster default"></div>
    <div class="form-row"><label for="node-input-lbAnnotations">Load-balancer annotations</label><textarea id="node-input-lbAnnotations" placeholder='{}'></textarea></div>
    <p class="esb-note">Uses the cluster's existing LoadBalancer and storage provisioners. On bare metal, configure a load-balancer implementation first. Hetzner defaults apply only to Hetzner; other providers receive a generic service plus these optional annotations.</p>
    <div class="form-row"><label for="node-input-externalDns">Manage DNS records</label><input type="checkbox" id="node-input-externalDns" style="width:auto"></div>
    <div id="esb-ocm-dns-fields">
      <div class="form-row"><label for="node-input-dnsProvider">DNS provider</label><select id="node-input-dnsProvider"><option value="auto">Infer Hetzner from cluster</option><option value="hetzner">Hetzner (upstream profile)</option><option value="ionos">IONOS (upstream profile)</option><option value="custom">Other ExternalDNS provider</option></select></div>
      <div id="esb-ocm-dns-token" class="form-row"><label for="node-input-dnsToken">DNS API token</label><input type="password" id="node-input-dnsToken" autocomplete="new-password"></div>
      <div id="esb-ocm-dns-custom">
        <div class="form-row"><label for="node-input-dnsValues">ExternalDNS values JSON</label><textarea id="node-input-dnsValues" placeholder='{"provider":{"name":"aws"}}'></textarea></div>
        <div class="form-row"><label for="node-input-dnsSecretData">DNS Secret JSON</label><input type="password" id="node-input-dnsSecretData" autocomplete="new-password" placeholder='{"api-key":"…"}'></div>
        <p class="esb-note">Provider values belong inside the external-dns subchart. Reference credentials through secretKeyRef using Secret name external-dns and the keys entered above. Workload identity may leave Secret JSON empty. See the provider examples in README.</p>
      </div>
    </div>
    <p id="esb-ocm-manual-dns" class="esb-note">The progress output will report the gateway address. Create the tenant's DNS record and allow public TCP 80/443, then run validate.</p>
    <h4>Tenant</h4>
    <div class="form-row"><label for="node-input-tenantId">Tenant ID</label><input type="text" id="node-input-tenantId"></div>
    <div class="form-row"><label for="node-input-tenantSubdomain">Tenant subdomain</label><input type="text" id="node-input-tenantSubdomain" placeholder="Derived from tenant ID"></div>
    <div class="form-row"><label for="node-input-tenantRelease">Tenant Helm release</label><input type="text" id="node-input-tenantRelease"></div>
    <p id="esb-ocm-tenant-preview" class="esb-note"></p>
    <div class="form-row"><label for="node-input-timeoutSeconds">Stage timeout (seconds)</label><input type="number" id="node-input-timeoutSeconds" min="60" max="7200"></div>
    <p class="esb-note">Argo CD tracks upstream main with autosync, prune and self-healing enabled. The first output returns the result; the second streams progress. Use an Inject node with msg.action = preflight, diagnose-api, diagnose-auth, deploy, inspect, validate or test-credentials.</p>
  </div>
</script>
<script type="text/javascript">
(function() {
  function jsonObject(v) { if(!v)return true;try{var o=JSON.parse(v);return o&&typeof o==='object'&&!Array.isArray(o);}catch(e){return false;} }
  RED.nodes.registerType('OCM-W-Stack',{
    category:'Easy Stack Builder',color:'#d9eaf2',icon:'font-awesome/fa-cubes',inputs:1,outputs:2,
    outputLabels:['Result','Progress'],label:function(){return this.name||'OCM W-Stack';},
    defaults:{name:{value:''},procedureVersion:{value:12},instanceName:{value:'ocm-wstack',required:true},domainAddress:{value:'',required:true},emailAddress:{value:'',required:true},provider:{value:'auto'},storageClass:{value:''},lbAnnotations:{value:'{}',validate:jsonObject},externalDns:{value:false},dnsProvider:{value:'auto'},dnsValues:{value:'{}',validate:jsonObject},tenantId:{value:'demo-tenant',required:true},tenantSubdomain:{value:''},tenantRelease:{value:'demotenant',required:true},timeoutSeconds:{value:1800,validate:function(v){return Number.isInteger(Number(v))&&v>=60&&v<=7200;}}},
    credentials:{kubeconfig:{type:'password'},dnsToken:{type:'password'},dnsSecretData:{type:'password'}},
    oneditprepare:function(){
      function dns(){var enabled=$('#node-input-externalDns').prop('checked');var custom=$('#node-input-dnsProvider').val()==='custom';$('#esb-ocm-dns-fields').toggle(enabled);$('#esb-ocm-manual-dns').toggle(!enabled);$('#esb-ocm-dns-token').toggle(!custom);$('#esb-ocm-dns-custom').toggle(custom);}
      function preview(){var sub=($('#node-input-tenantSubdomain').val()||$('#node-input-tenantId').val()||'demo-tenant').toLowerCase().replace(/_/g,'-');$('#esb-ocm-tenant-preview').text('Tenant endpoint: https://'+sub+'.'+($('#node-input-domainAddress').val()||'example.com'));}
      $('#node-input-externalDns, #node-input-dnsProvider').on('change',dns);dns();
      $('#node-input-domainAddress, #node-input-tenantId, #node-input-tenantSubdomain').on('input',preview);preview();
      $('#esb-ocm-kube-file').on('change',function(){var file=this.files[0];if(!file)return;if(file.size>2*1024*1024){RED.notify('Kubeconfig must be smaller than 2 MiB.','error');return;}var reader=new FileReader();reader.onload=function(){$('#node-input-kubeconfig').val('base64:'+reader.result.slice(reader.result.indexOf(',')+1)).trigger('change');};reader.onerror=function(){RED.notify('Could not read kubeconfig.','error');};reader.readAsDataURL(file);});
    },
    oneditsave:function(){this.procedureVersion=12;}
  });
})();
</script>
<script type="text/html" data-help-name="OCM-W-Stack">
  <p>Runs the official eclipse-xfsc/deployment ocm-wstack-init.sh, which calls basic-cluster-init.sh, then installs XFSC/tenant. Requires cluster-admin kubeconfig, Helm 3, kubectl, git, bash, jq, curl and base64 in ORCE.</p>
  <p>Set <code>msg.action</code> to <code>preflight</code> (read-only chart checks), <code>diagnose-api</code> (read-only API connection probes from ORCE), <code>diagnose-auth</code> (uploaded context and authenticated identity), <code>deploy</code> (default), <code>inspect</code> or <code>validate</code>. A fresh installation can be resumed with the same configuration. Existing unrelated upstream namespaces are never adopted.</p>
  <p><code>test-credentials</code> requires <code>msg.confirm = "CREATE TEST CREDENTIAL"</code>. It creates a test offering, retrieves and accepts it, then checks Storage read-back. Test data is retained as evidence. Only this result can report credential lifecycle validation.</p>
  <p><code>teardown</code> requires <code>msg.confirm = "REMOVE TENANT demotenant"</code> (substitute your configured release). It removes the tenant Helm release. Shared infrastructure, services, stored credentials and OpenBao keys remain. Removing the node only cancels its local process.</p>
  <p>State <code>ready</code> covers cluster readiness, TLS and metadata. It does not prove retrieval or storage. Native credential testing reports its stages separately and exports no tokens or credential bodies.</p>
</script>
