<!-- Editor UI for OCM-W-Stack node -->
<script type="text/x-red" data-template-name="OCM-W-Stack">
  <style>
    .form-row { display:flex; align-items:center; margin-bottom:10px; }
    .form-row label { width:160px!important; margin-right:10px; text-align:right; }
    .form-row input[type="text"], .form-row input[type="email"] { flex:1; }
    .form-row input[type="checkbox"] { flex:0 0 auto; width:auto; margin-right:8px; }
    .ocm-inline-note { font-size:12px; color:#666; }
    .ocm-tabs { display:flex; gap:8px; margin:6px 0 14px 170px; }
    .ocm-tab-button.active { background:#dcecf6; border-color:#8aaec4; }
    .ocm-tab-panel { display:none; border-left:2px solid #e6e6e6; padding-left:12px; margin-left:168px; }
    .ocm-tab-panel.active { display:block; }
    .ocm-tab-panel .form-row { margin-left:-168px; }
    .ocm-hint { margin:0 0 10px 170px; font-size:12px; color:#666; }
    .ocm-hint.warning { color:#b35f00; }
    .ocm-inline-note.warning { color:#b35f00; font-weight:600; }
  </style>

  <div class="form-row">
    <label for="node-input-name">Node label</label>
    <input type="text" id="node-input-name" placeholder="(optional) Display name in flow">
  </div>

  <div class="ocm-tabs">
    <button type="button" class="red-ui-button ocm-tab-button active" data-target="instance">Instance Info</button>
    <button type="button" class="red-ui-button ocm-tab-button" data-target="k8s">Kubernetes &amp; Domain</button>
    <button type="button" class="red-ui-button ocm-tab-button" data-target="keycloak">Keycloak &amp; Credentials</button>
    <button type="button" class="red-ui-button ocm-tab-button" data-target="orce">ORCE Initial Credentials</button>
  </div>

  <div class="ocm-hint" id="ocm-domain-hint">Use a bare FQDN such as apps.example.com. The node deploys cloud-wallet.&lt;domain&gt; and auth-cloud-wallet.&lt;domain&gt;.</div>

  <div class="ocm-tab-panel active" data-panel="instance">
    <div class="form-row">
      <label for="node-input-instanceName">Instance name</label>
      <input type="text" id="node-input-instanceName" placeholder="e.g. demo-01">
    </div>
  </div>

  <div class="ocm-tab-panel" data-panel="k8s">
    <div class="form-row">
      <label for="node-input-domainAddress">Domain</label>
      <input type="text" id="node-input-domainAddress" placeholder="e.g. apps.example.com">
    </div>

    <div class="form-row">
      <label for="node-input-kubeconfig">kubeconfig</label>
      <input type="file" id="node-input-kubeconfig" accept=".yml,.yaml,.conf,.txt">
      <input type="hidden" id="node-input-kubeconfigContent">
    </div>

    <div class="form-row">
      <label for="node-input-enableIngressNginxClusterConfig">Manage ingress controller</label>
      <input type="checkbox" id="node-input-enableIngressNginxClusterConfig">
      <span class="ocm-inline-note warning">Opt-in, cluster-wide: installs/reconciles ingress-nginx, enables snippet annotations, Critical annotation risk, TLS 1.3, and restarts the controller.</span>
    </div>

    <div class="form-row">
      <label for="node-input-deleteIngressNginxAdmissionWebhook">Delete ingress webhook</label>
      <input type="checkbox" id="node-input-deleteIngressNginxAdmissionWebhook">
      <span class="ocm-inline-note warning">Opt-in, cluster-wide: deletes the ingress-nginx admission webhook configuration and stale admission jobs.</span>
    </div>
  </div>

  <div class="ocm-tab-panel" data-panel="keycloak">
    <div class="form-row">
      <label for="node-input-emailAddress">Email</label>
      <input type="email" id="node-input-emailAddress" placeholder="e.g. admin@example.com">
    </div>

    <div class="form-row">
      <label for="node-input-privateKey">TLS Private Key</label>
      <input type="file" id="node-input-privateKey" accept=".key,.pem,.txt">
      <input type="hidden" id="node-input-privateKeyContent">
    </div>

    <div class="form-row">
      <label for="node-input-certificate">TLS Certificate</label>
      <input type="file" id="node-input-certificate" accept=".crt,.pem,.cer,.txt">
      <input type="hidden" id="node-input-certificateContent">
    </div>

    <div class="form-row">
      <label for="node-input-useCustomCaBundle">Custom CA bundle</label>
      <input type="checkbox" id="node-input-useCustomCaBundle">
      <span class="ocm-inline-note">Append an uploaded CA bundle to the served TLS chain</span>
    </div>

    <div class="form-row" id="ocm-ca-bundle-row">
      <label for="node-input-caBundle">CA Bundle</label>
      <input type="file" id="node-input-caBundle" accept=".crt,.pem,.cer,.txt">
      <input type="hidden" id="node-input-caBundleContent">
    </div>
  </div>
  <div class="ocm-tab-panel" data-panel="orce">
    <p>UI: https://cloud-wallet.&lt;domain&gt;/orce/. The editor uses a separate login and is accessible through port-forward only. Existing passwords are preserved on redeployment.</p>
    <div class="form-row"><label for="node-input-editorUsername">Editor administrator</label><input type="text" id="node-input-editorUsername" autocomplete="off"></div>
    <div class="form-row"><label for="node-input-editorPassword">Editor password</label><input type="password" id="node-input-editorPassword" autocomplete="new-password"></div>
    <div class="form-row"><label for="node-input-uiAdminUsername">OCM UI administrator</label><input type="text" id="node-input-uiAdminUsername" autocomplete="off"></div>
    <div class="form-row"><label for="node-input-uiAdminEmail">OCM UI administrator email</label><input type="email" id="node-input-uiAdminEmail" autocomplete="off"></div>
    <div class="form-row"><label for="node-input-uiAdminPassword">OCM UI password</label><input type="password" id="node-input-uiAdminPassword" autocomplete="new-password"></div>
    <div class="form-row"><label for="node-input-uiAdminFirstName">First name (optional)</label><input type="text" id="node-input-uiAdminFirstName" autocomplete="off"></div>
    <div class="form-row"><label for="node-input-uiAdminLastName">Last name (optional)</label><input type="text" id="node-input-uiAdminLastName" autocomplete="off"></div>
    <div class="form-row"><label for="node-input-orceStorageSize">ORCE PVC size</label><input type="text" id="node-input-orceStorageSize" autocomplete="off"></div>
    <div class="form-row"><label for="node-input-mongoStorageSize">MongoDB PVC size</label><input type="text" id="node-input-mongoStorageSize" autocomplete="off"></div>
    <div class="form-row"><label for="node-input-orceStorageClass">Storage class (blank: default)</label><input type="text" id="node-input-orceStorageClass" autocomplete="off"></div>
    <div class="form-row"><label for="node-input-offerIssuerHosts">Approved offer hosts (comma separated)</label><input type="text" id="node-input-offerIssuerHosts"></div>
    <div class="form-row"><label for="node-input-relationshipHosts">Approved remote OCM hosts (comma separated)</label><input type="text" id="node-input-relationshipHosts"></div>
    <div class="form-row"><label for="node-input-useExternalMongo">Use external MongoDB</label><input type="checkbox" id="node-input-useExternalMongo"></div>
    <div class="form-row" id="ocm-mongo-uri"><label for="node-input-mongoUri">MongoDB connection string</label><input type="password" id="node-input-mongoUri" autocomplete="new-password"></div>
  </div>
</script>

<script type="text/javascript">
(function() {
  function setupFile(fieldFile, fieldHidden) {
    var inp = $("#node-input-" + fieldFile)[0];
    if (!inp) return;
    inp.addEventListener("change", function() {
      var f = this.files && this.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function(e) {
        $("#node-input-" + fieldHidden).val(e.target.result);
      };
      reader.readAsText(f);
    });
  }

  function activateTab(target) {
    $(".ocm-tab-button").removeClass("active");
    $(".ocm-tab-button[data-target='" + target + "']").addClass("active");
    $(".ocm-tab-panel").removeClass("active");
    $(".ocm-tab-panel[data-panel='" + target + "']").addClass("active");
  }

  function updateCaBundleState() {
    var enabled = $("#node-input-useCustomCaBundle").prop("checked");
    $("#ocm-ca-bundle-row").toggle(enabled);
    $("#node-input-caBundle").prop("disabled", !enabled);
    return enabled;
  }

  function validateDomain() {
    var value = $("#node-input-domainAddress").val().trim();
    var hint = $("#ocm-domain-hint");
    var valid = !value || (!/^https?:\/\//i.test(value) && value.indexOf("/") === -1 && /^([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}$/.test(value));
    hint.toggleClass("warning", !valid);
    if (valid) {
      hint.text("Use a bare FQDN such as apps.example.com. The node deploys cloud-wallet.<domain> and auth-cloud-wallet.<domain>.");
    } else {
      hint.text("Domain must be a bare FQDN without scheme or path.");
    }
    return valid;
  }

  RED.nodes.registerType('OCM-W-Stack', {
    category: 'FAPs',
    color: '#c0deed',
    icon: 'bridge.svg',
    credentials: { editorPassword: {type:"password"}, uiAdminPassword: {type:"password"}, mongoUri: {type:"password"} },
    defaults: {
      editorUsername: {value:""},
      uiAdminUsername: {value:""},
      uiAdminEmail: {value:""},
      uiAdminFirstName: {value:""},
      uiAdminLastName: {value:""},
      orceStorageSize: {value:"3Gi"},
      mongoStorageSize: {value:"5Gi"},
      orceStorageClass: {value:""},
      useExternalMongo: {value:false},
      offerIssuerHosts: {value:"clearing.gaia-x.eu"},
      relationshipHosts: {value:""},

      name:               { value: "" },
      instanceName:       { value: "", required: true },
      domainAddress:      { value: "", required: true },
      emailAddress:       { value: "", required: true },
      kubeconfigContent:  { value: "", required: true },
      privateKeyContent:  { value: "", required: true },
      certificateContent: { value: "", required: true },
      useCustomCaBundle:  { value: false },
      enableIngressNginxClusterConfig: { value: false },
      deleteIngressNginxAdmissionWebhook: { value: false },
      caBundleContent:    {
        value: "",
        validate: function(value) {
          return !this.useCustomCaBundle || Boolean(value && String(value).trim());
        }
      }
    },
    inputs: 1,
    outputs: 1,
    label: function() {
      return this.name || this.instanceName || "OCM-W-Stack";
    },
    oneditprepare: function() {
      $("#node-input-useExternalMongo").on("change", function(){ $("#ocm-mongo-uri").toggle(this.checked); }).trigger("change");
      setupFile("kubeconfig", "kubeconfigContent");
      setupFile("privateKey", "privateKeyContent");
      setupFile("certificate", "certificateContent");
      setupFile("caBundle", "caBundleContent");
      $("#node-input-useCustomCaBundle").off("change.ocm").on("change.ocm", updateCaBundleState);
      $(".ocm-tab-button").off("click.ocm").on("click.ocm", function(evt) {
        evt.preventDefault();
        activateTab($(this).data("target"));
      });
      $("#node-input-domainAddress").off("input.ocm blur.ocm").on("input.ocm blur.ocm", validateDomain);
      activateTab("instance");
      updateCaBundleState();
      validateDomain();
    },
    oneditsave: function() {
      if (!validateDomain()) {
        RED.notify("Domain should be a bare hostname (no scheme or path).", "warning");
      }
      if (!$("#node-input-useCustomCaBundle").prop("checked")) {
        $("#node-input-caBundleContent").val("");
      } else if (!$("#node-input-caBundleContent").val().trim()) {
        RED.notify("Select a CA bundle or disable the Custom CA bundle option.", "warning");
      }
      if ($("#node-input-enableIngressNginxClusterConfig").prop("checked")) {
        RED.notify("Ingress controller management is enabled. This installs or reconciles shared cluster infrastructure.", "warning");
      }
      if ($("#node-input-deleteIngressNginxAdmissionWebhook").prop("checked")) {
        RED.notify("Ingress admission webhook deletion is enabled. This changes cluster-wide security controls.", "warning");
      }
    }
  });
})();
</script>
