<style>
.esb-ocm-form{--esb-accent:#236879;--esb-line:var(--red-ui-form-input-border-color,#d8e2e5);max-width:760px}
.esb-ocm-hero{padding:20px 22px;background:linear-gradient(120deg,#174d61,#337c80);color:white;border-radius:12px;margin-bottom:18px}
.esb-ocm-hero h3{margin:0 0 6px;font-size:21px;color:white}.esb-ocm-hero p{margin:0;opacity:.9}.esb-ocm-hero small{display:block;margin-top:12px;opacity:.8}
.esb-ocm-form .esb-card{border:1px solid var(--esb-line);border-radius:10px;padding:18px;margin:14px 0}
.esb-ocm-form .esb-card h4{margin:0 0 14px;font-size:15px}.esb-ocm-form .form-row label{width:165px;vertical-align:top;line-height:30px}
.esb-ocm-form .form-row input:not([type=checkbox]),.esb-ocm-form .form-row select,.esb-ocm-form textarea{width:calc(100% - 180px);box-sizing:border-box}
.esb-ocm-form .form-row input[type=checkbox]{width:auto;margin-top:8px}.esb-ocm-form .esb-note{color:var(--red-ui-secondary-text-color,#596b74);font-size:12px;line-height:1.6;margin:8px 0}
.esb-ocm-form .esb-upload{padding:10px 0;border-bottom:1px solid var(--esb-line);margin-bottom:8px}.esb-ocm-form .esb-file-status{display:block;margin:3px 0 0 170px;color:var(--esb-accent);font-size:12px}
.esb-ocm-form .esb-preview{padding:12px;border-left:3px solid var(--esb-accent);background:var(--red-ui-secondary-background,#f0f5f6);overflow-wrap:anywhere;margin:12px 0}.esb-ocm-form summary{cursor:pointer;font-weight:600;padding:10px 0}.esb-ocm-form details>div{padding-top:10px}

<div class="esb-ocm-form">
 <div class="esb-ocm-hero"><h3>OCM W-Stack</h3><p>Your OCM W-Stack UI, native services and infrastructure in one deployment.</p><small>ESB 12.3.0 · Deployment revision 8485621574ab · Frozen 2 October 2026</small></div>
 <ul id="esb-ocm-tabs"></ul><div id="esb-ocm-panels">
 <div id="esb-ocm-connect">
  <div class="esb-card"><h4>Connect your cluster</h4>
   <div class="form-row"><label for="node-input-name">Node label</label><input id="node-input-name" placeholder="OCM W-Stack"></div>
   <div class="form-row esb-upload"><label for="esb-kube-file">Kubeconfig</label><input id="esb-kube-file" type="file" accept=".yaml,.yml,.conf,.txt"><span id="esb-kube-status" class="esb-file-status"></span></div>
   <input type="password" style="display:none" id="node-input-kubeconfig">
   <p class="esb-note">Upload a self-contained cluster-admin kubeconfig. The cluster needs working LoadBalancer and persistent-volume provisioners. Hetzner and IONOS are detected automatically.</p>
  </div>
  <div class="esb-card"><h4>Deployment options</h4>
   <div class="form-row"><label for="node-input-externalDns">Manage DNS records</label><input id="node-input-externalDns" type="checkbox"></div>
   <div id="esb-dns-fields">
    <div class="form-row"><label for="node-input-dnsProvider">DNS provider</label><select id="node-input-dnsProvider"><option value="auto">Detect from cluster</option><option value="hetzner">Hetzner</option><option value="ionos">IONOS</option><option value="custom">Other ExternalDNS provider</option></select></div>
    <div id="esb-dns-token" class="form-row"><label for="node-input-dnsToken">DNS API token</label><input type="password" id="node-input-dnsToken" autocomplete="new-password"></div>
    <div id="esb-dns-custom"><div class="form-row"><label for="node-input-dnsValues">Provider values</label><textarea id="node-input-dnsValues"></textarea></div><div class="form-row"><label for="node-input-dnsSecretData">Provider credentials</label><input type="password" id="node-input-dnsSecretData" autocomplete="new-password"></div><p class="esb-note">ExternalDNS provider values and Secret key/value data, as JSON. See the provider examples in README.</p></div>
   </div>
   <p id="esb-manual-dns" class="esb-note">You manage DNS. Progress output reports the gateway address; point your selected hostnames to it. Deployment waits for HTTPS to respond.</p>
   <div class="form-row"><label for="node-input-publicDashboards">Public dashboards</label><input id="node-input-publicDashboards" type="checkbox"></div>
   <p class="esb-note">Enable authenticated Argo CD and Grafana at argocd and grafana on your base domain. The OCM W-Stack UI and native tenant services are always public.</p>
  </div>
  <details><summary>Advanced · provider and storage</summary><div>
   <div class="form-row"><label for="node-input-provider">Cluster provider</label><select id="node-input-provider"><option value="auto">Detect automatically</option><option value="hetzner">Hetzner</option><option value="ionos">IONOS Cloud</option><option value="generic">Generic Kubernetes</option><option value="aws">AWS</option><option value="azure">Azure</option><option value="gcp">Google Cloud</option><option value="openstack">OpenStack</option><option value="digitalocean">DigitalOcean</option><option value="oci">Oracle Cloud</option><option value="scaleway">Scaleway</option><option value="alibaba">Alibaba Cloud</option></select></div>
   <div id="esb-hetzner"><div class="form-row"><label for="node-input-lbLocation">Hetzner location</label><input id="node-input-lbLocation" placeholder="Detected from node topology"></div><p class="esb-note">Only set a location if your cluster spans regions. Annotations are generated from the detected topology.</p></div>
   <div class="form-row"><label for="node-input-storageClass">StorageClass</label><input id="node-input-storageClass" placeholder="Cluster default"></div>
   <div class="form-row"><label for="node-input-runtimeImage">ORCE version</label><select id="node-input-runtimeImage"><option value="ecofacis/xfsc-orce:2.0.15">2.0.15</option><option value="ecofacis/xfsc-orce:2.0.13">2.0.13</option></select></div>
   <div class="form-row"><label for="node-input-useExternalMongo">External MongoDB</label><input id="node-input-useExternalMongo" type="checkbox"></div>
   <div id="esb-mongo-uri" class="form-row"><label for="node-input-mongoUri">MongoDB URI</label><input type="password" id="node-input-mongoUri" autocomplete="new-password"></div>
   <div class="form-row"><label for="node-input-orceStorageSize">ORCE storage</label><input id="node-input-orceStorageSize"></div><div class="form-row"><label for="node-input-mongoStorageSize">MongoDB storage</label><input id="node-input-mongoStorageSize"></div>
   <div class="form-row"><label for="node-input-timeoutSeconds">Stage timeout</label><input type="number" id="node-input-timeoutSeconds" min="60" max="7200"></div>
  </div></details>
 </div>
 <div id="esb-ocm-domain" style="display:none">
  <div class="esb-card"><h4>Domain &amp; certificate</h4>
   <div class="form-row"><label for="node-input-domainAddress">Base domain</label><input id="node-input-domainAddress" placeholder="leanea.com"></div>
   <div class="form-row"><label for="node-input-tenantId">Tenant name</label><input id="node-input-tenantId" placeholder="demo-tenant"></div>
   <div id="esb-tenant-preview" class="esb-preview"></div>
   <div class="form-row esb-upload"><label for="esb-cert-file">Fullchain certificate</label><input id="esb-cert-file" type="file" accept=".pem,.crt,.cer,.txt"><span id="esb-cert-status" class="esb-file-status"></span></div>
   <div class="form-row esb-upload"><label for="esb-key-file">Private key</label><input id="esb-key-file" type="file" accept=".pem,.key,.txt"><span id="esb-key-status" class="esb-file-status"></span></div>
   <input type="password" style="display:none" id="node-input-tlsCertificate"><input type="password" style="display:none" id="node-input-tlsPrivateKey">
   <p class="esb-note">Use a public trusted PEM fullchain and its matching unencrypted PEM private key. A wildcard certificate such as *.leanea.com covers the tenant and optional dashboard hostnames. Upload renewed files here and run Deploy to replace them.</p>
  </div>
 </div>
 <div id="esb-ocm-access" style="display:none">
  <div class="esb-card"><h4>OCM UI administrator</h4>
   <div class="form-row"><label for="node-input-uiAdminUsername">Username</label><input id="node-input-uiAdminUsername" autocomplete="off"></div>
   <div class="form-row"><label for="node-input-uiAdminPassword">Initial password</label><input type="password" id="node-input-uiAdminPassword" autocomplete="new-password"></div>
   <p class="esb-note">At least 12 characters. The OCM W-Stack UI asks for a new password at first login. Accounts and roles survive subsequent deployments.</p>
  </div>
  <div class="esb-card"><h4>Editor administrator</h4>
   <div class="form-row"><label for="node-input-editorUsername">Username</label><input id="node-input-editorUsername" autocomplete="off"></div>
   <div class="form-row"><label for="node-input-editorPassword">Initial password</label><input type="password" id="node-input-editorPassword" autocomplete="new-password"></div>
   <p class="esb-note">Use a separate password of at least 12 characters. Optional dashboards initially use this password with username admin. Later password changes are retained.</p>
  </div>
  <div class="esb-preview">PCM connections are configured after login in the OCM W-Stack UI Connections page.</div>
 </div></div>
 <p class="esb-note">Connect an Inject node to start Deploy. Output 1 returns the result; output 2 shows progress, detected settings and DNS targets. An existing matching installation resumes safely.</p>
</div>
</script>
<script type="text/javascript">
(function(){
 function jsonObject(v){if(!v)return true;try{var x=JSON.parse(v);return x&&typeof x==='object'&&!Array.isArray(x);}catch(e){return false;}}
 RED.nodes.registerType('OCM-W-Stack',{
 category:'Easy Stack Builder',color:'#c7e2e4',icon:'font-awesome/fa-cubes',inputs:1,outputs:2,outputLabels:['Result','Progress'],label:function(){return this.name||'OCM W-Stack';},
 defaults:{name:{value:''},procedureVersion:{value:12},instanceName:{value:'ocm-wstack'},domainAddress:{value:'',required:true},emailAddress:{value:''},tenantId:{value:'demo-tenant',required:true},tenantRelease:{value:'demotenant'},tenantSubdomain:{value:''},provider:{value:'auto'},storageClass:{value:''},lbLocation:{value:''},lbNetworkZone:{value:''},lbType:{value:''},lbPrivate:{value:false},lbAnnotations:{value:'{}'},externalTrafficPolicy:{value:'Cluster'},gatewayRouting:{value:'internal'},externalDns:{value:false},dnsProvider:{value:'auto'},dnsValues:{value:'{}',validate:jsonObject},publicDashboards:{value:false},runtimeEnabled:{value:true},runtimeImage:{value:'ecofacis/xfsc-orce:2.0.15'},runtimeServices:{value:'{}'},pcm:{value:'{"enabled":false}'},orceStorageSize:{value:'3Gi'},mongoStorageSize:{value:'5Gi'},useExternalMongo:{value:false},editorUsername:{value:'admin'},uiAdminUsername:{value:'admin'},uiAdminEmail:{value:''},timeoutSeconds:{value:1800,validate:function(v){return Number.isInteger(Number(v))&&v>=60&&v<=7200;}}},
 credentials:{kubeconfig:{type:'password'},tlsCertificate:{type:'password'},tlsPrivateKey:{type:'password'},dnsToken:{type:'password'},dnsSecretData:{type:'password'},editorPassword:{type:'password'},uiAdminPassword:{type:'password'},mongoUri:{type:'password'}},
 oneditprepare:function(){
  var node=this,tabs=RED.tabs.create({id:'esb-ocm-tabs',onchange:function(tab){$('#esb-ocm-panels').children().hide();$('#'+tab.id).show();}});
  [['esb-ocm-connect','Cluster'],['esb-ocm-domain','Domain & certificate'],['esb-ocm-access','Access']].forEach(function(t){tabs.addTab({id:t[0],label:t[1]});});tabs.activateTab('esb-ocm-connect');
  function upload(fileId,credential,statusId,max){
   var input=$('#node-input-'+credential),status=$('#'+statusId);status.text(node.credentials&&node.credentials['has_'+credential]?'Saved securely':'Choose a file');
   $('#'+fileId).on('change',function(){var f=this.files[0];if(!f)return;if(f.size>max){RED.notify('File is too large.','error');return;}var reader=new FileReader();reader.onload=function(){input.val('base64:'+reader.result.split(',')[1]).trigger('change');status.text(f.name+' · ready');};reader.onerror=function(){RED.notify('Could not read '+f.name,'error');};reader.readAsDataURL(f);});
  }
  upload('esb-kube-file','kubeconfig','esb-kube-status',2097152);upload('esb-cert-file','tlsCertificate','esb-cert-status',131072);upload('esb-key-file','tlsPrivateKey','esb-key-status',131072);
  function options(){var dns=$('#node-input-externalDns').prop('checked'),custom=$('#node-input-dnsProvider').val()==='custom';$('#esb-dns-fields').toggle(dns);$('#esb-manual-dns').toggle(!dns);$('#esb-dns-custom').toggle(custom);$('#esb-dns-token').toggle(!custom);$('#esb-mongo-uri').toggle($('#node-input-useExternalMongo').prop('checked'));$('#esb-hetzner').toggle(['auto','hetzner'].includes($('#node-input-provider').val()));}
  function preview(){var domain=$('#node-input-domainAddress').val().replace(/^\*\./,'')||'leanea.com',tenant=(node.tenantSubdomain||$('#node-input-tenantId').val()||'demo-tenant').toLowerCase().replace(/_/g,'-');$('#esb-tenant-preview').text('OCM W-Stack UI: https://'+tenant+'.'+domain+'/orce/');}
  $('#node-input-externalDns,#node-input-dnsProvider,#node-input-provider,#node-input-useExternalMongo').on('change',options);options();$('#node-input-domainAddress,#node-input-tenantId').on('input',preview);preview();
 },
 oneditsave:function(){this.procedureVersion=12;this.runtimeEnabled=true;this.gatewayRouting='internal';this.externalTrafficPolicy='Cluster';this.pcm='{"enabled":false}';}

<script type="text/html" data-help-name="OCM-W-Stack">
<p>Deploys the reviewed XFSC deployment revision, tenant, uploaded TLS, and OCM-CR OCM W-Stack UI. Requires a cluster-admin kubeconfig and bash, git, Helm 3 or 4, kubectl, jq, curl and base64 in the deployer runtime.</p>
<p>Set <code>msg.action</code> to <code>deploy</code> (default), <code>preflight</code> (read-only source and chart validation), <code>inspect</code>, <code>validate</code>, <code>diagnose-api</code> or <code>diagnose-auth</code>. Deploy also resumes or updates this node’s matching installation. Unrelated existing namespaces are not adopted.</p>
<p>With DNS automation off, set the reported A/AAAA or CNAME targets for the displayed hostnames. Uploaded TLS eliminates certificate issuance waits. Renewal is manual: replace both uploads and run Deploy.</p>
<p><code>test-credentials</code> requires <code>msg.confirm = "CREATE TEST CREDENTIAL"</code>; it exercises native issuance, receipt and storage read-back and retains test data. Normal readiness is reported separately from credential lifecycle testing.</p>
<p>Removing this node cancels local work and retains cluster data. Explicit <code>teardown</code> requires <code>msg.confirm = "REMOVE TENANT demotenant"</code> and removes tenant routing only.</p>
</script>
