{{- range .Values.services }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: esb-{{ .name }}
  namespace: {{ .namespace }}
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-gateway
    namespace: infrastructure
  listeners:
    - name: https
      hostname: {{ .host | quote }}
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ $.Values.tlsSecret }}
            kind: Secret
            group: ""
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: esb-{{ .name }}
  namespace: {{ .namespace }}
spec:
  parentRefs:
    - name: esb-{{ .name }}
      kind: ListenerSet
      group: gateway.networking.k8s.io
  hostnames: [{{ .host | quote }}]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .service }}
          port: {{ .port }}
{{- end }}
