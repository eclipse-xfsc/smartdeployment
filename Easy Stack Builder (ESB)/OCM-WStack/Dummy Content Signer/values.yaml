dummycontentsigner:
  image:
    tag: 2.4.3
    pullPolicy: Always
  podAnnotations:
    inject.xfsc.io/enabled: 'false'
  config:
    nats:
      queuegroup: dummysigner
      url: nats://nats.NAMESPACE.svc.cluster.local:4222
      requestTimeOut: 10s
    origin: https://cloud-wallet.DOMAIN
    credential_issuer: https://cloud-wallet.DOMAIN
    authorization_server:
    - https://cloud-wallet.DOMAIN
    credential_endpoint: https://cloud-wallet.DOMAIN/api/issuance/credential
    signerCredentialUrl: http://signer.NAMESPACE.svc.cluster.local:8080/v1/credential
    signerKey: signerkey
  resourceProvider:
    enabled: false
  resourceClaim:
    enabled: false
