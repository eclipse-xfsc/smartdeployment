signer:
  replicaCount: 2
  name: signer
  nameOverride: ''
  image:
    repository: node-654e3bca7fbeeed18f81d7c7.ps-xaas.io/tsa
    name: signer
    tag: 2.3.5
    pullPolicy: Always
  useConfigMap: false
  configMapName: my-configmap
  useSecretRef: false
  secretRefName: my-secret
  podAnnotations:
    inject.xfsc.io/enabled: 'false'
  resourceProvider:
    enabled: false
  resources:
    requests:
      cpu: 150m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 70
  metrics:
    enabled: true
    port: 2112
  log:
    level: debug
    encoding: json
  security:
    runAsNonRoot: false
    runAsUid: 0
    runAsGid: 0
  service:
    port: 8080
  signer:
    version: 0.26.0
    http:
      host: ''
      port: 8080
      timeout:
        idle: 120s
        read: 10s
        write: 10s
    nats:
      enabled: true
      natsHost: nats://nats.NAMESPACE.svc.cluster.local:4222
      topic: sign
      status: status.data.create
    sdjwt:
      url: http://sd-jwt-service.NAMESPACE.svc.cluster.local:3000
    engine:
      clusterAddress: 127.0.0.1:50051
      image: node-654e3bca7fbeeed18f81d7c7.ps-xaas.io/tsa/crypto-provider-hashicorp-vault-plugin:2.0.6
      address: 0.0.0.0:50051
      pullPolicy: Always
      secretEnv:
        VAULT_TOKEN:
          name: vault
          key: token
        VAULT_ADRESS:
          name: vault
          key: address
      clusterAdress: 127.0.0.1:50051
      env: null
  ingress:
    enabled: false
    annotations:
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/rewrite-target: /$2
    tlsEnabled: true
    frontendDomain: tsa.xfsc.dev
    frontendTlsSecretName: cert-manager-tls
  istio:
    injection:
      pod: false
