# -- Default number of instances to start 
replicaCount: 2
# -- Application name
name: signer
# -- Ovverwrites application name
nameOverride: ""

image:
  repository: node-654e3bca7fbeeed18f81d7c7.ps-xaas.io/tsa
  # -- Image name
  name: signer
  # -- Image tag
  # Uses .Chart.AppVersion if empty
  tag: "main"
  # -- Image sha, usually generated by the CI
  # Uses image.tag if empty
  #sha: ""
  # -- Image pull policy
  pullPolicy: Always
  # -- Image pull secret when internal image is used
  #pullSecrets: deployment-key-light

## Use configMap or secretRef for environment variables
useConfigMap: false
configMapName: my-configmap
useSecretRef: false
secretRefName: my-secret

podAnnotations:
    inject.xfsc.io/enabled: "false"
    inject.xfsc.io/needs: "nats,sdjwt,statuslist"

resourceProvider:
  enabled: true
  name: ""
  scope: Cluster
  description: Crypto Service
  allow:
    namespaces: []


resources:
  requests:
    cpu: 150m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

autoscaling:
  # -- Enable autoscaling
  enabled: false
  # -- Minimum replicas
  minReplicas: 2
  # -- Maximum replicas
  maxReplicas: 3
  # -- CPU target for autoscaling trigger
  targetCPUUtilizationPercentage: 70
  # -- Memory target for autoscaling trigger
  targetMemoryUtilizationPercentage: 70

metrics:
  # -- Enable prometheus metrics
  enabled: true
  # -- Port for prometheus metrics
  port: 2112

log:
  level: "debug"
  encoding: json


security:
  # -- by default, apps run as non-root
  runAsNonRoot: false
  # -- User used by the apps
  runAsUid: 0
  # -- Group used by the apps
  runAsGid: 0

service:
  port: 8080

signer:
  version: 0.26.0
  http:
    host: ""
    port: 8080
    timeout:
      idle: 120s
      read: 10s
      write: 10s
  nats:
    enabled: true
    natsHost: nats://nats.nats.svc.cluster.local:4222
    topic: signer-topic
    status: status.data.create
  sdjwt:
    url: http://sdjwt-service.default.svc.cluster.local:3000
  #policy:
  #   url: 
   #  termsOfUsePolicy: 
   #  serviceEndpointPolicy: 
  engine:
    clusterAddress: 127.0.0.1:50051
    image: node-654e3bca7fbeeed18f81d7c7.ps-xaas.io/tsa/crypto-provider-hashicorp-vault-plugin:2.0.6
    address: 0.0.0.0:50051
    pullPolicy: Always
    secretEnv:
      VAULT_TOKEN: 
        name: openbao-connection
        key: VAULT_TOKEN  
      VAULT_ADRESS: 
        name: openbao-connection
        key: VAULT_ADDR  

ingress:
  enabled: false
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  tlsEnabled: true
  frontendDomain: tsa.xfsc.dev
  frontendTlsSecretName: cert-manager-tls

istio:
  injection:
    pod: true

