nameOverride: ""
fullnameOverride: ""

tenant:
  id: tenant_space
  subdomain: ""
  domain: domain.com
  key: eckey
  group: default
  type: StatusList2021
  region: EU
  country: DE

certificate:
  enabled: true
  secretName: ""
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
    group: cert-manager.io
  duration: ""
  renewBefore: ""
  privateKey:
    algorithm: RSA
    size: 4096

listenerSet:
  annotations: {}
  listenerName: https
  port: 443
  allowedRoutes:
    namespaces:
      from: Same

httpRoute:
  annotations:
    external-dns.alpha.kubernetes.io/ttl: "240"

openbao:
  enabled: true
  address: http://openbao.security.svc.cluster.local:8200
  image:
    repository: openbao/openbao
    tag: "2.4.4"
    pullPolicy: IfNotPresent
  auth:
    mount: kubernetes
    role: xfsc-tenant-bootstrap
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  transit:
    mountPath: ""
    keyType: ecdsa-p256
    additionalKeys: []
  job:
    annotations: {}
    backoffLimit: 3

tenantRegistration:
  enabled: true

  image:
    repository: curlimages/curl
    tag: "8.16.0"
    pullPolicy: IfNotPresent

  serviceUrl: "http://dummycontentsigner.ocm-wstack.svc.cluster.local:8080"

  job:
    annotations: {}
    backoffLimit: 6

  cron:
    schedule: "*/15 * * * *"
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 3
    annotations: {}

ocm_verifier:
  - name: verifier-request-object
    enabled: true
    path: /api/verifier/presentation/proof/
    pathType: PathPrefix
    targetPathTemplate: /v1/tenants/{tenant}/presentation/proof/
    method: GET
    backend:
      name: credential-verification-service
      port: 8080
  - name: verifier-direct-post
    enabled: true
    path: /api/verifier/presentation/proof/
    pathType: PathPrefix
    targetPathTemplate: /v1/tenants/{tenant}/presentation/proof/
    method: POST
    backend:
      name: credential-verification-service
      port: 8080
  - name: didcomm
    path: /api/didcomm
    targetPath: /
    backend:
      name: didcomm-connector
      port: 9090

ocm_issuer:
  - name: credential-issuance
    path: /api/issuance/credential
    backend:
      name: issuance-service
      port: 8080

  - name: credential-offering
    path: /api/offering
    backend:
      name: credential-retrieval-service
      port: 8080

  - name: offering-create
    method: POST
    path: /api/offering/create
    backend:
      name: credential-offering-service
      port: 8080

  - name: credential-verification
    path: /api/presentation
    backend:
      name: credential-verification-service
      port: 8080

  - name: openid-configuration
    path: /.well-known/openid-configuration
    targetPath: /.well-known/openid-configuration
    backend:
      name: pre-authorization-bridge-service
      port: 8080

  - name: pre-authorization-token
    method: POST
    path: /api/auth/token
    targetPath: /token
    backend:
      name: pre-authorization-bridge-service
      port: 8080

  - name: openid-credential-issuer
    path: /.well-known/openid-credential-issuer
    targetPathTemplate: /v1/tenants/{tenant}/.well-known/openid-credential-issuer
    backend:
      name: well-known-service
      port: 8080

  - name: status-list
    path: /api/status
    backend:
      name: status-list-service
      port: 8080

  - name: did-document
    path: /.well-known/did.json
    targetPath: /v1/did/document
    backend:
      name: signer
      port: 8080

  - name: did-configuration
    path: /.well-known/did-configuration.json
    targetPath: /v1/did/configuration
    backend:
      name: signer
      port: 8080

  - name: jwks
    path: /.well-known/jwks.json
    targetPath: /v1/jwks
    backend:
      name: signer
      port: 8080
