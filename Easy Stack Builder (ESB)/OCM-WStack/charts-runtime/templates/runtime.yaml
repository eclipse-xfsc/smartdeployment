apiVersion: v1
kind: ServiceAccount
metadata:
  name: ocm-orce
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ocm-orce-data
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.storage.class }}
  storageClassName: {{ .Values.storage.class | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.orceSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocm-orce
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: ocm-orce}
  template:
    metadata:
      labels: {app: ocm-orce}
      annotations:
        checksum/seed: {{ printf "%s%s" ((.Files.Glob "files/**").AsConfig) (include (print $.Template.BasePath "/config.yaml") .) | sha256sum }}
        checksum/config: {{ .Values.runtimeConfig | toJson | sha256sum }}
        checksum/secret: {{ .Values.secretChecksum | quote }}
    spec:
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: ocm-orce
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: seed-orce-runtime
          image: {{ required "An ORCE base image is required" .Values.image | quote }}
          command: ["/bin/sh", "/seed/seed.sh"]
          env:
            - {name: OCM_BASE_IMAGE, value: {{ .Values.image | quote }}}
            - {name: npm_config_cache, value: /tmp/npm-cache}
            - {name: npm_config_update_notifier, value: "false"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: seed, mountPath: /seed, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: orce
          image: {{ required "An ORCE base image is required" .Values.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          ports: [{name: http, containerPort: 1880}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "2", memory: 2Gi}
          env:
            - {name: OCM_RUNTIME_CONFIG, value: /etc/ocm/config.json}
            - {name: OCM_RUNTIME_SECRETS, value: /run/ocm-secrets/secrets.json}
          startupProbe:
            httpGet: {path: /orce/ui-api/v1/health/live, port: http}
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /orce/ui-api/v1/health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet: {path: /orce/ui-api/v1/health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 4
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /etc/ocm, readOnly: true}
            - {name: secrets, mountPath: /run/ocm-secrets, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: ocm-orce-data}
        - name: seed
          configMap: {name: ocm-orce-seed}
        - name: config
          configMap: {name: ocm-orce-config}
        - name: secrets
          secret: {secretName: ocm-orce-runtime}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ocm-orce
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector: {app: ocm-orce}
  ports: [{name: http, port: 80, targetPort: 1880}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ocm-orce-ui
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: {{ .Values.listenerSetName | quote }}
      sectionName: https
  hostnames: [{{ required "host is required" .Values.host | quote }}]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /orce}
      backendRefs:
        - {name: ocm-orce, port: 80}
    - matches:
        - path: {type: Exact, value: /}
      filters:
        - type: RequestRedirect
          requestRedirect:
            path: {type: ReplaceFullPath, replaceFullPath: /orce/}
            statusCode: 302
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ocm-orce-https-redirect
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-gateway
      namespace: infrastructure
      sectionName: http
  hostnames: [{{ .Values.host | quote }}]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
            statusCode: 301
