apiVersion: v1
kind: ConfigMap
metadata:
  name: ocm-orce-config
  namespace: {{ .Release.Namespace }}
data:
  config.json: {{ .Values.runtimeConfig | toJson | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ocm-orce-seed
  namespace: {{ .Release.Namespace }}
data:
  seed.sh: |
{{ .Files.Get "files/seed.sh" | indent 4 }}
binaryData:
  runtime.tgz: {{ .Files.Get "files/runtime.tgz" | b64enc | quote }}
  ui.tgz: {{ .Files.Get "files/ui.tgz" | b64enc | quote }}
