{{- if .Values.mongo.embedded }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ocm-ui-mongo-data
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.storage.class }}
  storageClassName: {{ .Values.storage.class | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.mongoSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocm-ui-mongodb
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: ocm-ui-mongodb}
  template:
    metadata:
      labels: {app: ocm-ui-mongodb}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999}
      containers:
        - name: mongodb
          image: {{ .Values.mongo.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          ports: [{containerPort: 27017, name: mongodb}]
          env:
            - {name: MONGO_INITDB_ROOT_USERNAME, value: ocm_ui}
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: ocm-orce-runtime, key: mongo-password}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            tcpSocket: {port: mongodb}
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /data/db}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: ocm-ui-mongo-data}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ocm-ui-mongodb
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector: {app: ocm-ui-mongodb}
  ports: [{name: mongodb, port: 27017, targetPort: mongodb}]
{{- end }}
