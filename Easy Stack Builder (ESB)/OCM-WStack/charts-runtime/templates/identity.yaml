apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ocm-ui-identity-data
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storage.class | quote }}
  resources:
    requests:
      storage: {{ .Values.identity.storageSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocm-ui-postgres
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: ocm-ui-postgres}
  template:
    metadata:
      labels: {app: ocm-ui-postgres}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ .Values.identity.postgresImage | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - {name: POSTGRES_DB, value: keycloak}
            - {name: POSTGRES_USER, value: keycloak}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: ocm-orce-runtime, key: postgres-password}
          ports: [{name: postgres, containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, keycloak, -d, keycloak]}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: ocm-ui-identity-data}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ocm-ui-postgres
  namespace: {{ .Release.Namespace }}
spec:
  selector: {app: ocm-ui-postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocm-ui-keycloak
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: ocm-ui-keycloak}
  template:
    metadata:
      labels: {app: ocm-ui-keycloak}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: keycloak
          image: {{ .Values.identity.image | quote }}
          args: [start, --import-realm]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - {name: KC_DB, value: postgres}
            - {name: KC_DB_URL, value: 'jdbc:postgresql://ocm-ui-postgres:5432/keycloak'}
            - {name: KC_DB_USERNAME, value: keycloak}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: ocm-orce-runtime, key: postgres-password}
            - {name: KC_HTTP_ENABLED, value: 'true'}
            - {name: KC_HTTP_RELATIVE_PATH, value: /orce/identity}
            - {name: KC_HOSTNAME, value: {{ printf "https://%s/orce/identity" .Values.host | quote }}}
            - {name: KC_PROXY_HEADERS, value: xforwarded}
            - {name: KC_HEALTH_ENABLED, value: 'true'}
            - {name: KC_HTTP_MANAGEMENT_RELATIVE_PATH, value: /}
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: bootstrap-admin}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: ocm-orce-runtime, key: keycloak-admin-password}
            - {name: JAVA_OPTS_KC_HEAP, value: '-Xms128m -Xmx512m'}
          ports: [{name: http, containerPort: 8080}, {name: management, containerPort: 9000}]
          startupProbe:
            httpGet: {path: /health/ready, port: management}
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /health/ready, port: management}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: management}
            periodSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: '2', memory: 1Gi}
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: realm
          secret: {secretName: ocm-ui-realm-import}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ocm-ui-keycloak
  namespace: {{ .Release.Namespace }}
spec:
  selector: {app: ocm-ui-keycloak}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ocm-ui-identity
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: {app: ocm-ui-keycloak}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: ocm-orce}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: infrastructure}
          podSelector:
            matchLabels: {gateway.envoyproxy.io/owning-gateway-name: envoy-gateway}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - podSelector:
            matchLabels: {app: ocm-ui-postgres}
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ocm-ui-postgres
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: {app: ocm-ui-postgres}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: ocm-ui-keycloak}
      ports: [{protocol: TCP, port: 5432}]
  egress: []
