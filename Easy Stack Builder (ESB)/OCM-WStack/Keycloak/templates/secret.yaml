{{- $existing := lookup "v1" "Secret" .Release.Namespace "keycloak-init-secrets" }}
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-init-secrets
type: Opaque
data:
  username: YWRtaW4=
{{- range $key := list "password" "postgres-password" "admin-password" }}
  {{ $key }}: {{ if and $existing (hasKey $existing.data $key) }}{{ index $existing.data $key }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
{{- end }}
