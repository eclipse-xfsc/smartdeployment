sd-jwt-service:
  image:
    name: sd-jwt-service
    tag: 1.2.7
  podAnnotations:
    inject.xfsc.io/enabled: 'false'
  config:
    signUrl: http://signer.NAMESPACE.svc.cluster.local:8080/v1/sign
    resolverUrl: http://universal-resolver.NAMESPACE.svc.cluster.local:8080/1.0/identifiers/
  resourceProvider:
    enabled: false
  resourceClaim:
    enabled: false
