{{- if .Values.testServer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: test-server
  labels:
    app.kubernetes.io/name: test-server
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: test-server
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.testServer.service.port }}
      targetPort: http
{{- end }}
