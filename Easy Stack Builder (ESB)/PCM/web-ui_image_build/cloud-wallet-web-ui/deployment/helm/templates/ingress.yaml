apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-web-ui-ingress
  annotations:
spec:
  ingressClassName: nginx
  rules:
    - host: cloud-wallet.xfsc.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-web-ui-service
                port:
                  number: 3000
  tls:
    - hosts:
        - cloud-wallet.xfsc.dev
      secretName: xfsc-wildcard