{{- $secretName := "fc-keycloak-client-secret" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
type: Opaque
data:
  {{- if $existing }}
  keycloak_client_secret: {{ index $existing.data "keycloak_client_secret" | quote }}
  {{- else }}
  keycloak_client_secret: {{ randAlphaNum 48 | b64enc | quote }}
  {{- end }}
